[package]
name = "a-rust-vm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "arvm"
path = "src/main.rs"

[lib]
name = "a_rust_vm"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
